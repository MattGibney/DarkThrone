services:
  postgres:
    image: postgres:17.4
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - '${PG_PORT}:5432'
    volumes:
      - '${DATA_ROOT}/postgres:/var/lib/postgresql/data'
    cpus: '1.0'
    mem_limit: 256m
